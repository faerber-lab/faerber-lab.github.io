# _data/datasets.yml
# Selected datasets / knowledge graphs / resources from our group (curated).
# Fields:
# - title: name of the dataset/resource
# - kind: Dataset | Knowledge Graph | Embeddings | GML Dataset | Software
# - what: one-line description (keep crisp)
# - year: release year (approx. OK)
# - license: short license string (leave empty if unclear)
# - tags: short tags for filtering / grouping
# - links: list of relevant URLs (homepage, Zenodo/DOI, paper, code, etc.)

